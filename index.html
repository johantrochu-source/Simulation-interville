<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Intervilles : simulation du chariot</title>
<style>
:root{--bg:#f7f8fa;--fg:#14202e;--mut:#5d6b7a;--card:#fff;--line:#d6dde6;--ink:#1f4fd8;--ok:#13804a;--bad:#c0392b;--track:#1f4fd8;--rack:#d9822b;--ep:#d9822b;--ec:#1f4fd8;--em:#13804a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161e;--fg:#e8eef5;--mut:#9aa8b8;--card:#18212c;--line:#2c3947;--ink:#7aa2ff;--ok:#4cc58a;--bad:#ff7d6e;--track:#7aa2ff;--rack:#f0a050;--ep:#f0a050;--ec:#7aa2ff;--em:#4cc58a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10161e;--fg:#e8eef5;--mut:#9aa8b8;--card:#18212c;--line:#2c3947;--ink:#7aa2ff;--ok:#4cc58a;--bad:#ff7d6e;--track:#7aa2ff;--rack:#f0a050;--ep:#f0a050;--ec:#7aa2ff;--em:#4cc58a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;line-height:1.45}
main{max-width:980px;margin:0 auto;padding:14px 16px 28px}
h1{font-size:1.25rem;margin:4px 0 10px;font-weight:650}
canvas{display:block;width:100%;aspect-ratio:7.8/5.55;background:var(--card);border:1px solid var(--line);border-radius:10px}
.card{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
label.big{display:block;font-size:1.05rem;margin-bottom:6px}
input[type=range]{width:100%;accent-color:var(--ink);height:32px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
button,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#res{margin:10px 0;padding:10px 12px;border-left:4px solid var(--line);background:var(--bg);border-radius:0 8px 8px 0}
#res.ok{border-color:var(--ok)}#res.bad{border-color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:8px 0 0}
.grid div{background:var(--bg);border-radius:8px;padding:8px 10px}
.grid b{display:block;font-size:1.15rem;font-variant-numeric:tabular-nums}
.grid span,.mut{color:var(--mut);font-size:.86rem}
</style>
</head>
<body>
<main>
<h1>Intervilles : jusqu’où monte le chariot ?</h1>
<canvas id="c" role="img" aria-label="Piste, chariot, trou et énergies"></canvas>
<section class="card">
  <label class="big" for="m">Masse du joueur : <b id="mv">50</b> kg <span class="mut" id="pw"></span></label>
  <input id="m" type="range" min="10" max="400" step="1" value="50">
  <div class="row">
    <button id="pp">⏸ Pause</button><button id="rs">↻ Relancer</button>
    <label>Vitesse <select id="sp"><option value="0.5">×0,5</option><option value="1" selected>×1</option><option value="2">×2</option></select></label>
  </div>
  <div id="res" aria-live="polite"></div>
  <div class="grid">
    <div><span>Masse totale</span><b id="iM">–</b></div>
    <div><span>Vitesse</span><b id="iV">–</b></div>
    <div><span>Hauteur</span><b id="iY">–</b></div>
    <div><span>Boules dans le trou</span><b id="iD">–</b></div>
  </div>
  <p class="mut" id="thr"></p>
</section>
<p class="mut">Modèle : frottement constant de 60 N sur tout le trajet, trou au milieu du plat, boule prise ou lâchée sans changer la vitesse du chariot. Départ à 4 m sans vitesse initiale, racks à 2 m.</p>
</main>
<script>
const g=9.81,f=60,mc=15,mb=5,H0=4,Ra=.2,Rb=1.8,L=3;
const p1=Math.PI*Ra/2,p2=p1+2,p3=p2+Math.PI*Rb/2,p4=p3+L,p5=p4+Math.PI*Rb/2;
const pHole=p3+L/2,pRR=p5+.2,pRL=p1+1.8,p6=p5+2,STEP=.01;
const $=id=>document.getElementById(id);
const nf=(x,d=2)=>x.toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});
function Y(p){if(p<p1)return 3.8+Ra*Math.cos(p/Ra);if(p<p2)return 3.8-(p-p1);if(p<p3)return Rb*(1-Math.sin((p-p2)/Rb));if(p<p4)return 0;if(p<p5)return Rb*(1-Math.cos((p-p4)/Rb));if(p<p6)return 1.8+(p-p5);const a=(p-p6)/Ra;return a<Math.PI/2?3.8+Ra*Math.sin(a):4}
function DY(p){if(p<p1)return-Math.sin(p/Ra);if(p<p2)return-1;if(p<p3)return-Math.cos((p-p2)/Rb);if(p<p4)return 0;if(p<p5)return Math.sin((p-p4)/Rb);if(p<p6)return 1;return(p-p6)/Ra<Math.PI/2?Math.cos((p-p6)/Ra):0}
function pos(p){if(p<p1){const a=p/Ra;return[-Ra+Ra*Math.sin(a),3.8+Ra*Math.cos(a)]}
 if(p<p2)return[0,3.8-(p-p1)];
 if(p<p3){const a=(p-p2)/Rb;return[Rb-Rb*Math.cos(a),Rb*(1-Math.sin(a))]}
 if(p<p4)return[Rb+(p-p3),0];
 if(p<p5){const a=(p-p4)/Rb;return[4.8+Rb*Math.sin(a),Rb*(1-Math.cos(a))]}
 if(p<p6)return[6.6,1.8+(p-p5)];const a=(p-p6)/Ra;return a<Math.PI/2?[6.8-Ra*Math.cos(a),3.8+Ra*Math.sin(a)]:[6.8+(p-p6-Ra*Math.PI/2),4]}

function sim(mj,rec){
 const dt=.002;let M=mc+mj+mb,ab=1,dr=0,pR=0,pL=0,mR=0,mL=0,t=0,tEnd=45,k=0;
 const A={P:[],V:[],M:[],B:[],D:[],R:[],L:[]};
 const push=(p,v)=>{A.P.push(p);A.V.push(v);A.M.push(M);A.B.push(ab);A.D.push(dr);A.R.push(mR);A.L.push(mL)};
 const e0=Math.max(g*.2-f*p1/M,0),v0=Math.sqrt(2*e0);
 let p=p1,v=v0;
 if(rec){const t0=v0>0?2*p1/v0:1;for(let s=0;s<t0;s+=STEP)push(p1*(s/t0)**2,2*p1*s/(t0*t0));t=t0}
 while(t<tEnd){
  const ag=-g*DY(p),fr=f/M;let a;
  if(v>0)a=ag-fr;else if(v<0)a=ag+fr;else if(Math.abs(ag)<=fr)break;else a=ag-Math.sign(ag)*fr;
  let vn=v+a*dt;if(v*vn<0)vn=0;
  const pn=p+(v+vn)/2*dt;
  if((p<pHole&&pn>=pHole||p>pHole&&pn<=pHole)&&ab){M-=mb;ab=0;dr++;if(dr==3)tEnd=t+1.5}
  if(!ab&&!pR&&p<pRR&&pn>=pRR){M+=mb;ab=1;pR=1}
  if(!ab&&pR&&!pL&&p>pRL&&pn<=pRL){M+=mb;ab=1;pL=1}
  p=pn;v=vn;t+=dt;
  if(p>p4)mR=Math.max(mR,Y(p));
  if(pR&&p<p3)mL=Math.max(mL,Y(p));
  if(rec&&++k%5==0)push(p,v);
 }
 if(rec)push(p,v);
 return{A,res:{pR,pL,dr,mR,mL}}}
function thr(key){let lo=5,hi=200;for(let i=0;i<22;i++){const m=(lo+hi)/2;if(sim(m,false).res[key])hi=m;else lo=m}return hi}

const cv=$('c'),ctx=cv.getContext('2d');
let data,mj=50,simT=0,playing=true,speed=1,last=0,done=false;
function load(){mj=+$('m').value;$('mv').textContent=mj;$('pw').textContent='(poids ≈ '+nf(mj*g,0)+' N)';
 data=sim(mj,true);simT=0;playing=true;done=false;$('pp').textContent='⏸ Pause';
 const r=data.res,el=$('res');
 if(!r.pR){el.className='bad';el.textContent=`Le chariot n’atteint pas le rack droit : il s’arrête à ${nf(r.mR)} m sur 2,00 m.`}
 else if(!r.pL){el.className='bad';el.textContent=`Rack droit atteint (sommet à ${nf(r.mR)} m). Au retour, le rack gauche n’est pas atteint : ${nf(r.mL)} m sur 2,00 m.`}
 else{el.className='ok';el.textContent=`Aller-retour complet : rack droit atteint (sommet à ${nf(r.mR)} m), rack gauche atteint, ${r.dr} boules déposées.`}}
function colors(){const s=getComputedStyle(document.documentElement),v=n=>s.getPropertyValue(n).trim();
 return{fg:v('--fg'),mut:v('--mut'),line:v('--line'),track:v('--track'),rack:v('--rack'),ep:v('--ep'),ec:v('--ec'),em:v('--em'),card:v('--card')}}

function draw(){
 const dpr=window.devicePixelRatio||1,w=Math.round(cv.clientWidth*dpr);
 if(cv.width!==w){cv.width=w;cv.height=Math.round(w*5.55/7.8)}
 const s=cv.width/7.8,ox=.6*s,oy=4.75*s,C=colors();
 const X=x=>ox+x*s,Yp=y=>oy-y*s;
 ctx.clearRect(0,0,cv.width,cv.height);
 const fs=Math.max(10*dpr,.12*s);ctx.font=`${fs}px "Avenir Next","Segoe UI",system-ui,sans-serif`;
 const N=data.A.P.length,i=Math.min(Math.floor(simT/STEP),N-1);
 if(i==N-1&&playing){playing=false;done=true;$('pp').textContent='▶ Rejouer'}
 const p=data.A.P[i],v=data.A.V[i],M=data.A.M[i],ab=data.A.B[i],dr=data.A.D[i];
 // niveaux de repère
 ctx.setLineDash([6*dpr,6*dpr]);ctx.lineWidth=1*dpr;ctx.strokeStyle=C.line;
 for(const yv of[4,2]){ctx.beginPath();ctx.moveTo(X(-.6),Yp(yv));ctx.lineTo(X(7.2),Yp(yv));ctx.stroke()}
 ctx.setLineDash([]);ctx.fillStyle=C.mut;ctx.fillText('H₀ = 4 m',X(.35),Yp(4)-5*dpr);ctx.fillText('h = 2 m',X(.35),Yp(2)-5*dpr);
 // piste
 ctx.lineWidth=.06*s;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=C.track;ctx.beginPath();
 ctx.moveTo(X(-.6),Yp(4));ctx.lineTo(X(-.2),Yp(4));
 for(let q=0;q<=p5;q+=.03){const[x,y]=pos(q);ctx.lineTo(X(x),Yp(y))}
 ctx.lineTo(X(6.6),Yp(3.8));
 for(let a=Math.PI;a>=Math.PI/2-.001;a-=.1)ctx.lineTo(X(6.8+Ra*Math.cos(a)),Yp(3.8+Ra*Math.sin(a)));
 ctx.lineTo(X(7.2),Yp(4));ctx.stroke();
 // trou
 ctx.clearRect(X(3.15),Yp(0)-.05*s,.3*s,.1*s);
 ctx.lineWidth=2*dpr;ctx.beginPath();ctx.moveTo(X(3.15),Yp(0));ctx.lineTo(X(3.15),Yp(-.7));ctx.lineTo(X(3.45),Yp(-.7));ctx.lineTo(X(3.45),Yp(0));ctx.stroke();
 ctx.fillStyle=C.fg;for(let b=0;b<dr;b++){ctx.beginPath();ctx.arc(X(3.3),Yp(-.56+.21*b),.1*s,0,7);ctx.fill()}
 ctx.fillStyle=C.mut;ctx.fillText('Trou',X(3.55),Yp(-.3));
 // racks
 ctx.setLineDash([5*dpr,4*dpr]);ctx.strokeStyle=C.rack;ctx.lineWidth=2*dpr;
 for(const x0 of[-.4,6.6]){ctx.strokeRect(X(x0),Yp(2.3),.4*s,.3*s);ctx.fillStyle=C.fg;
  for(let b=0;b<2;b++){ctx.beginPath();ctx.arc(X(x0+.1+.2*b),Yp(2.15),.085*s,0,7);ctx.fill()}}
 ctx.setLineDash([]);ctx.fillStyle=C.rack;ctx.fillText('Rack',X(-.55),Yp(2.4));ctx.fillText('Rack',X(6.62),Yp(2.4));
 ctx.fillStyle=C.mut;ctx.fillText('Départ',X(-.55),Yp(4)-6*dpr);
 // repères de hauteur maximale atteinte
 const mR=data.A.R[i],mL=data.A.L[i];
 ctx.lineWidth=2*dpr;ctx.strokeStyle=C.em;ctx.fillStyle=C.em;
 if(mR>0){ctx.beginPath();ctx.moveTo(X(6.3),Yp(mR));ctx.lineTo(X(6.6),Yp(mR));ctx.stroke();ctx.fillText(nf(mR)+' m',X(5.55),Yp(mR)+4*dpr)}
 if(mL>0){ctx.beginPath();ctx.moveTo(X(0),Yp(mL));ctx.lineTo(X(.3),Yp(mL));ctx.stroke();ctx.fillText(nf(mL)+' m',X(.35),Yp(mL)+4*dpr)}
 // énergies
 const ep=M*g*Y(p),ec=.5*M*v*v,Mx=(mc+mj+mb)*g*H0*1.1;
 [['Ep',ep,C.ep],['Ec',ec,C.ec],['Em',ep+ec,C.em]].forEach(([n,val,col],k)=>{
  const bx=2.5+k*.75,bh=Math.min(val/Mx,1)*1.5;ctx.fillStyle=col;ctx.fillRect(X(bx),Yp(2.7+bh),.4*s,bh*s);
  ctx.fillStyle=C.fg;ctx.textAlign='center';ctx.fillText(n,X(bx+.2),Yp(2.55));ctx.fillStyle=C.mut;ctx.fillText(nf(val,0)+' J',X(bx+.2),Yp(2.7+bh)-4*dpr);ctx.textAlign='left'});
 // chariot
 const q=Math.max(p,.005),[cx,cy]=pos(q),[ax,ay]=pos(q+.01),[bx,by]=pos(Math.max(q-.01,0));
 const ang=Math.atan2(ay-by,ax-bx),nx=-Math.sin(ang),ny=Math.cos(ang);
 ctx.save();ctx.translate(X(cx+nx*.17),Yp(cy+ny*.17));ctx.rotate(-ang);
 ctx.fillStyle=C.fg;ctx.fillRect(-.28*s,-.11*s,.56*s,.22*s);
 ctx.beginPath();ctx.arc(-.17*s,.12*s,.06*s,0,7);ctx.arc(.17*s,.12*s,.06*s,0,7);ctx.fill();
 const bw=Math.min(.12+.0016*mj,.5),hr=Math.min(.07+.0006*mj,.2);
 ctx.fillStyle=C.track;ctx.fillRect(-(bw/2)*s,-(.11+.3)*s,bw*s,.3*s);
 ctx.beginPath();ctx.arc(0,-(.11+.3+hr)*s,hr*s,0,7);ctx.fill();
 if(ab){ctx.fillStyle=C.rack;ctx.beginPath();ctx.arc(.18*s,-.21*s,.1*s,0,7);ctx.fill()}
 ctx.restore();
 $('iM').textContent=nf(M,0)+' kg';$('iV').textContent=nf(Math.abs(v),1)+' m/s';$('iY').textContent=nf(Y(p))+' m';$('iD').textContent=dr+' / 3'}

function frame(now){if(!last)last=now;const d=(now-last)/1000;last=now;if(playing)simT+=Math.min(d,.1)*speed;draw();requestAnimationFrame(frame)}
$('m').addEventListener('input',load);
$('rs').onclick=load;
$('pp').onclick=()=>{if(done)load();else{playing=!playing;$('pp').textContent=playing?'⏸ Pause':'▶ Lecture'}};
$('sp').onchange=e=>speed=+e.target.value;
$('thr').textContent=`Seuils calculés par la simulation : premier aller dès ${nf(thr('pR'),1)} kg, aller-retour complet dès ${nf(thr('pL'),1)} kg.`;
load();requestAnimationFrame(frame);
</script>
</body>
</html>
